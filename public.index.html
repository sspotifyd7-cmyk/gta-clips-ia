
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA Clips AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 16px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 550px;
      margin: 50px auto;
      text-align: center;
      background: #1b1d22;
      padding: 30px 20px;
      border-radius: 18px;
      border: 1px solid #333;
    }
    h1 { color: #a6ff4d; }
    p { color: #bbb; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      background: #292c32;
      color: white;
      border: 1px solid #444;
    }
    button {
      background: #a6ff4d;
      color: #111;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #status { margin-top: 20px; }
    .clip {
      margin-top: 15px;
      padding: 15px;
      background: #292c32;
      border-radius: 10px;
      text-align: left;
    }
    .clip a { color: #a6ff4d; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 GTA CLIPS AI</h1>
    <p>Envie seu gameplay e deixe a inteligência artificial selecionar os melhores momentos.</p>

    <form id="form">
      <input type="file" id="video" accept="video/*" required>
      <button id="submit" type="submit">GERAR 5 CORTES</button>
    </form>

    <p id="status"></p>
    <section id="results"></section>
  </main>

  <script>
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const button = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const file = document.getElementById('video').files[0];
      if (!file) return;

      const data = new FormData();
      data.append('video', file);

      button.disabled = true;
      status.textContent = 'Analisando seu gameplay...';
      results.innerHTML = '';

      try {
        const response = await fetch('/api/process', {
          method: 'POST',
          body: data
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Erro ao processar.');

        status.textContent = 'Cortes gerados!';
        result.clips.forEach((clip, index) => {
          const item = document.createElement('div');
          item.className = 'clip';

          const title = document.createElement('h3');
          title.textContent = `${index + 1}. ${clip.title}`;

          const reason = document.createElement('p');
          reason.textContent = clip.reason;

          const link = document.createElement('a');
          link.href = clip.url;
          link.textContent = 'Baixar vídeo MP4';
          link.download = '';

          item.append(title, reason, link);
          results.appendChild(item);
        });
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
